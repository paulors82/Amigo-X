<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amigo X | Administração</title><link rel="stylesheet" href="style.css"><main><h1>🎁 Amigo X</h1><p>Organize seu sorteio secreto.</p><p id="msg" role="alert"></p><section id="login"><form id="auth"><label>E-mail</label><input id="email" type="email" required><label>Senha</label><input id="senha" type="password" required><button>Entrar</button></form></section><section id="app" hidden><button id="sair" class="secondary">Sair</button><h2>Novo evento</h2><form id="novo"><label>Nome do evento</label><input id="nome" required placeholder="Amigo X da família"><label>Valor sugerido</label><input id="presente" placeholder="R$ 100"><label>Data da confraternização</label><input id="data" type="date"><label>Participantes (um por linha)</label><textarea id="nomes" rows="6" required placeholder="Ana&#10;Carlos&#10;Mariana"></textarea><small>Confira os nomes antes de criar. O sorteio será fixado e não poderá ser alterado nesta versão.</small><br><button>Criar evento e gerar links</button></form><h2>Meus eventos</h2><select id="eventos"></select><button id="atualizar" class="secondary">Atualizar andamento</button><div id="painel"></div></section></main><footer>Amigo X • Sorteio individual</footer><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';import {URL,KEY} from './config.js';
const $=id=>document.getElementById(id), db=createClient(URL,KEY);const msg=t=>$('msg').textContent=t||'';
async function rpc(n,a={}){const {data,error}=await db.rpc(n,a);if(error)throw error;return data}
function run(fn){return async e=>{e?.preventDefault();const b=e?.submitter|| (e?.currentTarget?.tagName==='BUTTON'?e.currentTarget:null);if(b)b.disabled=true;msg('');try{await fn()}catch(err){msg(err.message)}finally{if(b)b.disabled=false}}}
async function lista(prefer){const es=await rpc('ax_eventos_lista');const s=$('eventos');s.replaceChildren();for(const e of es)s.add(new Option(e.nome,e.id));if(prefer)s.value=prefer;await painel()}
async function painel(){const root=$('painel');root.replaceChildren();if(!$('eventos').value)return;const ps=await rpc('ax_painel',{p_evento:$('eventos').value});const count=ps.filter(p=>p.revelado).length;const h=document.createElement('p');h.textContent=`${count} de ${ps.length} participantes tiraram seu papel`;root.append(h);const bar=document.createElement('progress');bar.max=ps.length;bar.value=count;root.append(bar);for(const p of ps){const row=document.createElement('div');row.className='person';const name=document.createElement('strong');name.textContent=p.nome;const status=document.createElement('small');status.textContent=p.revelado?'✓ Realizado':'Pendente';const url=new window.URL('sorteio.html',location.href);url.hash=p.token;const text=`Olá, ${p.nome}! Tire seu papel do Amigo X pelo link exclusivo: ${url.href}\nNão compartilhe este link.`;const a=document.createElement('a');a.className='btn';a.textContent='WhatsApp';a.href='https://wa.me/?text='+encodeURIComponent(text);a.target='_blank';a.rel='noopener';const copy=document.createElement('button');copy.className='secondary';copy.textContent='Copiar link';copy.onclick=async()=>{try{await navigator.clipboard.writeText(url.href);copy.textContent='Copiado'}catch{prompt('Copie o link:',url.href)}};row.append(name,status,a,copy);root.append(row)}}
async function sessao(){const {data}=await db.auth.getSession();$('login').hidden=!!data.session;$('app').hidden=!data.session;if(data.session)await lista();else $('painel').replaceChildren()}
$('auth').onsubmit=run(async()=>{const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('senha').value});if(error)throw error;$('senha').value='';await sessao()});$('sair').onclick=run(async()=>{await db.auth.signOut();await sessao()});$('novo').onsubmit=run(async()=>{const nomes=$('nomes').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!confirm('Confirmar lista e criar sorteio definitivo?'))return;const id=await rpc('ax_criar',{p_nome:$('nome').value,p_presente:$('presente').value,p_data:$('data').value||null,p_nomes:nomes});$('novo').reset();await lista(id)});$('eventos').onchange=run(painel);$('atualizar').onclick=run(painel);run(sessao)();
</script></html>
