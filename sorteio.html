<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Amigo X | Tire seu papel</title><link rel="stylesheet" href="style.css"><main class="center"><h1 id="evento">🎁 Amigo X</h1><p id="msg" role="alert">Carregando seu convite...</p><section id="convite" hidden><h2 id="ola"></h2><p id="detalhes"></p><section id="urna"><div class="gift" aria-hidden="true">🎁</div><p>Seu papel está esperando por você.</p><button id="tirar">Tirar meu papel</button></section><section id="resultado" hidden class="paper"><small>Seu amigo X é...</small><h1 id="amigo"></h1><p>🎉 Guarde o segredo até o grande dia!</p><small>Você pode voltar a este link para consultar o mesmo resultado.</small></section></section></main><footer>Amigo X • Seu segredo está aqui</footer><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';import {URL,KEY} from './config.js';const db=createClient(URL,KEY,{auth:{persistSession:false,autoRefreshToken:false}}),$=id=>document.getElementById(id);const token=location.hash.slice(1);async function ver(revelar){$('tirar').disabled=true;try{if(!/^[0-9a-f-]{36}$/i.test(token))throw new Error('Convite inválido. Solicite seu link ao organizador.');const {data,error}=await db.rpc('ax_ver',{p_token:token,p_revelar:revelar});if(error)throw error;$('msg').textContent='';$('evento').textContent=data.evento;$('ola').textContent='Olá, '+data.pessoa+'!';$('detalhes').textContent=[data.presente?'Presente: '+data.presente:'',data.data_evento?'Data: '+data.data_evento.split('-').reverse().join('/'):''].filter(Boolean).join(' • ');$('convite').hidden=false;$('urna').hidden=data.revelado;$('resultado').hidden=!data.revelado;$('amigo').textContent=data.amigo||''}catch(e){$('msg').textContent=e.message}finally{$('tirar').disabled=false}}$('tirar').onclick=()=>ver(true);ver(false);
</script></html>
